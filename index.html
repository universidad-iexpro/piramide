<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa la pirámide · Universidad IEXPRO</title>
<meta name="description" content="Responde tres preguntas, completa la pirámide y revela el holograma de la Universidad IEXPRO.">
<meta property="og:title" content="Completa la pirámide · Universidad IEXPRO">
<meta property="og:description" content="Responde tres preguntas, completa la pirámide y revela el holograma.">
<meta name="theme-color" content="#0D1038">
<link rel="icon" href="assets/icono.png">
<link rel="apple-touch-icon" href="assets/icono.png">
<link rel="stylesheet" href="estilos.css">
</head>
<body data-fase="inicio">
<div class="fondo" aria-hidden="true"><span class="aura a1"></span><span class="aura a2"></span></div>
<video id="video" autoplay muted playsinline hidden></video>
<div class="velo" aria-hidden="true"></div>
<canvas id="lienzo" tabindex="0" role="img" aria-label="Pirámide sin completar. Arrastra o usa las flechas para girarla."></canvas>
<img class="respaldo" id="respaldo" src="assets/monograma-holo.png" alt="" hidden>

<header class="marca" id="marca"><img src="assets/logo-iexpro.png" width="800" height="223" alt="Universidad IEXPRO. Formación de excelencia. Incorporada a la SEP, clave 07PSU0162R."></header>

<button class="chip" id="chip-camara" aria-pressed="false" hidden>
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9Zm3 13a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
  <span id="chip-texto">Cámara</span>
</button>
<p class="aviso" id="aviso-camara" role="status" aria-live="polite" hidden></p>

<main class="hoja" id="panel">
  <svg class="arco" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="grad-arco" x1="0" x2="1"><stop offset="0" stop-color="#7A2BD0"/><stop offset=".5" stop-color="#FF3D9F"/><stop offset="1" stop-color="#7A2BD0"/></linearGradient></defs>
    <path d="M0 46Q200 2 400 46Z" fill="#191C63"/>
    <path d="M0 46Q200 -22 400 46Q200 2 0 46Z" fill="url(#grad-arco)"/>
  </svg>
  <div class="contenido">
    <div id="vista-inicio">
      <p class="etiqueta" id="etiqueta"></p>
      <h1 id="titulo"></h1>
      <p class="texto" id="introduccion"></p>
      <div class="acciones">
        <button class="principal" id="comenzar"><span>Comenzar</span></button>
        <button class="secundario" id="comenzar-camara">Comenzar con mi cámara</button>
      </div>
    </div>

    <div id="vista-pregunta" hidden>
      <div class="progreso"><span id="contador"></span><div class="marcas" id="marcas" aria-hidden="true"></div></div>
      <h2 id="pregunta" tabindex="-1"></h2>
      <div class="opciones" id="opciones"></div>
      <p class="retro" id="retro" role="status" aria-live="polite"></p>
      <button class="principal" id="continuar" hidden><span></span></button>
    </div>

    <div id="vista-final" hidden>
      <p class="etiqueta">Reto superado</p>
      <h2 class="gran-titulo" id="final-titulo" tabindex="-1"></h2>
      <p class="texto" id="final-mensaje"></p>
      <div class="acciones dos">
        <button class="principal" id="camara"><span>Ver sobre mi cámara</span></button>
        <button class="secundario" id="repetir">Volver a jugar</button>
      </div>
    </div>
  </div>
</main>
<noscript><p class="sin-js">Para jugar, activa JavaScript en tu navegador.</p></noscript>
<script src="preguntas.js"></script>
<script src="assets/texturas.js"></script>
<script src="vendor/three-tres.js"></script>
<script src="escena.js"></script>
<script src="app.js"></script>
</body>
</html>
